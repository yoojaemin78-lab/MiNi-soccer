<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>SOCCER MATCH V5.1</title>
<style>
:root{--bg:#090d12;--panel:#131923;--panel2:#1b2330;--line:#293546;--text:#f5f7fb;--muted:#96a2b2;--green:#5ed28a;--red:#ff7e87;--yellow:#ffd166}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:radial-gradient(circle at 50% -15%,#233247 0,#101721 34%,#090d12 74%)}
.app{max-width:900px;margin:0 auto;padding:12px 10px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 3px 8px}
h1{margin:0;font-size:24px}
.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.card{background:rgba(19,25,35,.97);border:1px solid var(--line);border-radius:18px;padding:13px;margin:11px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;color:#a8b2c0;font-size:10px;font-weight:800;margin:8px 2px 5px}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer}
button.primary{background:#f5f7fb;color:#10151c;border-color:#f5f7fb}
input,select{width:100%;background:#0d131b;color:#f5f7fb;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:13px}
.status{display:flex;align-items:center;gap:7px;color:#b5bfcc;font-size:11px;margin-top:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#7a8492}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.loading{background:var(--yellow)}
.notice{background:#0f151d;border:1px solid #263140;border-radius:12px;padding:10px;color:#aab4c2;font-size:11px;line-height:1.55}
.league-title{font-size:12px;font-weight:950;color:#dce3ec;margin:16px 2px 7px}
.fixture{background:#0f151d;border:1px solid #283444;border-radius:15px;padding:11px;margin:8px 0}
.fixture-top{display:flex;justify-content:space-between;gap:8px;color:#8f9baa;font-size:10px;margin-bottom:9px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{text-align:center;font-size:12px;font-weight:900}
.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 5px}
.vs{font-size:11px;color:#788494;font-weight:900;text-align:center}
.score{font-size:20px;color:#fff}
.empty{padding:20px 4px;text-align:center;color:#8d98a8;font-size:12px}
.badbox{background:#261419;border:1px solid #5c2730;color:#ffb7bf;border-radius:12px;padding:10px;font-size:11px;line-height:1.6}
@media(max-width:560px){.app{padding:9px 8px 45px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>SOCCER MATCH <span style="font-size:10px;color:#7d8998">V5.1 TEST</span></h1>
    <div class="sub">ESPN 무료 현재경기 연결 확인용 · API 키 필요 없음</div>
  </div>
</header>

<section class="card">
  <div class="notice">
    지금은 기능을 욕심내지 않고 <b>현재 시즌 경기 목록이 무료로 실제 뜨는지</b>만 확인합니다.
    이게 확인되면 순위 → 경기상세 → 라인업/부상/카드 순서로 붙입니다.
  </div>
  <div class="grid2" style="margin-top:8px">
    <div>
      <label>날짜</label>
      <input type="date" id="matchDate">
    </div>
    <div>
      <label>범위</label>
      <select id="league">
        <option value="all">전체 축구</option>
        <option value="eng.1">EPL</option>
        <option value="esp.1">LaLiga</option>
        <option value="ger.1">Bundesliga</option>
        <option value="ita.1">Serie A</option>
        <option value="fra.1">Ligue 1</option>
        <option value="uefa.champions">UEFA Champions League</option>
        <option value="uefa.europa">UEFA Europa League</option>
        <option value="usa.1">MLS</option>
      </select>
    </div>
  </div>
  <button class="primary" id="loadBtn" style="width:100%;margin-top:10px">경기 불러오기</button>
  <div class="status"><span class="dot" id="dot"></span><span id="status">대기 중</span></div>
</section>

<section class="card">
  <div style="font-size:16px;font-weight:950">경기 목록</div>
  <div id="results"><div class="empty">경기 불러오기를 눌러주세요.</div></div>
</section>
</div>

<script>
const $ = s => document.querySelector(s);

function todayKST(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const o={}; p.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});
  return `${o.year}-${o.month}-${o.day}`;
}
$('#matchDate').value = todayKST();

function ymd(d){ return d.replaceAll('-',''); }
function esc(v=''){ return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function setStatus(text,type=''){ $('#status').textContent=text; $('#dot').className='dot '+type; }

function kstTime(iso){
  if(!iso) return '-';
  try{
    return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));
  }catch(e){ return iso; }
}

function teamData(c){
  return {
    name: c?.team?.displayName || c?.team?.shortDisplayName || c?.team?.name || '-',
    logo: c?.team?.logo || c?.team?.logos?.[0]?.href || '',
    score: c?.score ?? '',
    winner: !!c?.winner
  };
}

function leagueLabel(ev){
  return ev?.league?.name || ev?.league?.displayName || ev?.season?.slug || '기타 경기';
}

async function fetchJson(url){
  const r = await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function load(){
  const date=$('#matchDate').value;
  const league=$('#league').value;
  if(!date) return;
  setStatus('ESPN 연결 중…','loading');
  $('#results').innerHTML='<div class="empty">불러오는 중…</div>';

  const path=`/apis/site/v2/sports/soccer/${encodeURIComponent(league)}/scoreboard?dates=${ymd(date)}&limit=1000`;
  const urls=[
    'https://site.api.espn.com'+path,
    'https://site.web.api.espn.com'+path
  ];

  let data=null, lastErr=null, used='';
  for(const u of urls){
    try{ data=await fetchJson(u); used=u.includes('site.web')?'ESPN WEB API':'ESPN SITE API'; break; }
    catch(e){ lastErr=e; }
  }
  if(!data){
    setStatus('연결 실패','bad');
    $('#results').innerHTML=`<div class="badbox">ESPN 호출 실패: ${esc(lastErr?.message||'unknown')}<br>브라우저에서 ESPN 요청이 차단됐을 가능성이 있습니다.</div>`;
    return;
  }

  const events=Array.isArray(data.events)?data.events:[];
  setStatus(`${used} 정상 · ${events.length}경기`,'ok');

  if(!events.length){
    $('#results').innerHTML='<div class="empty">이 날짜/범위에 표시할 경기가 없습니다.</div>';
    return;
  }

  const groups={};
  for(const ev of events){
    const key=leagueLabel(ev);
    (groups[key] ||= []).push(ev);
  }

  let html='';
  for(const [lname,list] of Object.entries(groups)){
    html += `<div class="league-title">${esc(lname)} · ${list.length}경기</div>`;
    for(const ev of list){
      const comp=ev?.competitions?.[0]||{};
      const cs=comp?.competitors||[];
      const home=teamData(cs.find(x=>x.homeAway==='home')||cs[0]);
      const away=teamData(cs.find(x=>x.homeAway==='away')||cs[1]);
      const state=ev?.status?.type?.state||'pre';
      const detail=ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'';
      const middle=state==='pre'?'VS':`${away.score||0} : ${home.score||0}`;
      html += `<div class="fixture">
        <div class="fixture-top"><span>${esc(kstTime(ev.date))}</span><span>${esc(detail)}</span></div>
        <div class="teams">
          <div class="team">${home.logo?`<img src="${esc(home.logo)}" alt="">`:''}${esc(home.name)}</div>
          <div class="vs ${state!=='pre'?'score':''}">${esc(middle)}</div>
          <div class="team">${away.logo?`<img src="${esc(away.logo)}" alt="">`:''}${esc(away.name)}</div>
        </div>
      </div>`;
    }
  }
  $('#results').innerHTML=html;
}

$('#loadBtn').addEventListener('click',load);
load();
</script>
</body>
</html>
