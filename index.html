<html lang="ko">

<style>
:root{--bg:#090d12;--panel:#131923;--panel2:#1b2330;--line:#293546;--text:#f5f7fb;--muted:#96a2b2;--green:#5ed28a;--red:#ff7e87;--yellow:#ffd166;--blue:#74b7ff;--shadow:0 15px 40px rgba(0,0,0,.30)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:radial-gradient(circle at 50% -15%,#233247 0,#101721 34%,#090d12 74%)}
.app{max-width:980px;margin:0 auto;padding:12px 10px 60px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 3px 8px}h1{margin:0;font-size:24px;letter-spacing:.3px}.sub{font-size:11px;color:var(--muted);margin-top:5px}.card{background:rgba(19,25,35,.97);border:1px solid var(--line);border-radius:18px;padding:13px;margin:11px 0;box-shadow:var(--shadow)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.title{font-size:16px;font-weight:950}.small{font-size:10px;color:var(--muted);line-height:1.5}
button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 11px;font-size:12px;font-weight:850;cursor:pointer}button:active{transform:scale(.98)}button.active,button.primary{background:#f5f7fb;color:#10151c;border-color:#f5f7fb}button:disabled{opacity:.45}input,select{width:100%;background:#0d131b;color:#f5f7fb;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:13px}label{display:block;color:#a8b2c0;font-size:10px;font-weight:800;margin:8px 2px 5px}.top-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.top-tabs button{padding:11px}.status{display:flex;align-items:center;gap:7px;color:#b5bfcc;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#7a8492}.dot.ok{background:var(--green)}.dot.loading{background:var(--yellow)}.dot.bad{background:var(--red)}.notice{background:#0f151d;border:1px solid #263140;border-radius:12px;padding:9px 10px;color:#aab4c2;font-size:11px;line-height:1.55}.hidden{display:none!important}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.segment{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.segment button{white-space:nowrap}.league-tools{display:flex;gap:7px;align-items:center;margin-top:10px}.league-tools .segment{flex:1}.league-picker{margin-top:10px;padding:10px;background:#0f151d;border:1px solid #293646;border-radius:14px}.league-results{max-height:280px;overflow:auto;margin-top:8px}.league-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px;border-bottom:1px solid #253140}.league-item:last-child{border-bottom:0}.league-item img{width:30px;height:30px;object-fit:contain}.league-name{font-size:12px;font-weight:900}.league-country{font-size:9px;color:#8793a3;margin-top:2px}.star{font-size:18px;padding:4px 8px;background:transparent;border:0}.selected-league{margin-top:9px;font-size:11px;color:#b9c3cf}.fixture-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.fixture{background:#0f151d;border:1px solid #283444;border-radius:15px;padding:11px;cursor:pointer}.fixture-top{display:flex;justify-content:space-between;gap:8px;color:#8f9baa;font-size:10px;margin-bottom:8px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{text-align:center;font-size:12px;font-weight:900}.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 5px}.vs{font-size:11px;color:#788494;font-weight:900}.score{font-size:19px;color:#fff}.empty,.loader{padding:18px 4px;text-align:center;color:#8d98a8;font-size:12px}.detail-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:3px 0 12px}.bigteam{text-align:center;font-weight:950;font-size:13px}.bigteam img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 6px}.kickoff{text-align:center;color:#98a5b5;font-size:10px}.section{margin-top:15px}.section h3{font-size:13px;margin:0 0 8px}.summarybox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.summary{padding:9px;background:#0f151d;border:1px solid #293646;border-radius:12px;text-align:center}.summary span{display:block;color:#909baa;font-size:9px}.summary b{display:block;font-size:16px;margin-top:4px}.form-line{display:flex;gap:5px;flex-wrap:wrap}.form-pill{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:950}.W{background:#173a25;color:#8ee6a8}.D{background:#3b3420;color:#ffe08a}.L{background:#421f25;color:#ff9ca9}.result-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.055);font-size:10px}.result-row:last-child{border-bottom:0}.result-teams{font-size:11px;color:#d6dce5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-score{font-weight:950;font-size:12px}.h2h-toolbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.analysis{background:linear-gradient(135deg,#121c27,#10161f);border:1px solid #33445a;border-radius:15px;padding:12px}.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.signal{background:#0d141d;border:1px solid #2b394b;border-radius:11px;padding:9px}.signal span{display:block;font-size:9px;color:#8f9baa}.signal b{display:block;font-size:13px;margin-top:4px}.good{color:#8fe7a8}.warn{color:#ffe08a}.bad{color:#ff9aa4}.weather{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.weather .stat b{font-size:13px}.stat{background:#151d28;border:1px solid #2a3747;border-radius:11px;padding:8px;text-align:center}.stat span{display:block;color:#8e99a8;font-size:9px}.stat b{display:block;font-size:14px;margin-top:4px}.lineup-wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lineup{background:#0f151d;border:1px solid #293646;border-radius:13px;padding:10px}.lineup-title{font-weight:950;font-size:12px;margin-bottom:7px}.player{font-size:10px;padding:5px 0;border-bottom:1px solid #222e3c}.player:last-child{border-bottom:0}.injury{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #253140;font-size:10px}.injury:last-child{border-bottom:0}.card-event{display:grid;grid-template-columns:46px 1fr auto;gap:7px;padding:7px 0;border-bottom:1px solid #253140;font-size:10px}.card-event:last-child{border-bottom:0}.yellow{color:#ffd166}.red{color:#ff7e87}.odds-book{background:#0f151d;border:1px solid #293646;border-radius:13px;padding:10px;margin:8px 0}.bookname{font-size:11px;font-weight:950;margin-bottom:7px}.market{margin-top:8px}.market-title{font-size:9px;color:#8e99a9;font-weight:800;margin-bottom:5px}.odds-values{display:flex;gap:5px;flex-wrap:wrap}.odd{background:#1a2230;border:1px solid #303d50;border-radius:8px;padding:6px 8px;min-width:60px;text-align:center;font-size:10px}.odd b{display:block;font-size:12px;margin-top:2px}.api-panel{display:none}.api-panel.show{display:block}.table-wrap{overflow-x:auto;margin-top:10px;border:1px solid #263241;border-radius:13px}table{border-collapse:collapse;width:100%;min-width:760px;background:#0e141c;font-size:10px}th,td{padding:8px 6px;border-bottom:1px solid #232e3d;text-align:center;white-space:nowrap}th{position:sticky;top:0;background:#18212d;color:#aab4c1;font-size:9px;z-index:1}tr:last-child td{border-bottom:0}tr.teamrow{cursor:pointer}.rank{font-weight:950}.club{display:flex;align-items:center;gap:7px;text-align:left;font-weight:900}.club img{width:24px;height:24px;object-fit:contain}.gf{color:#8fe7a8;font-weight:950}.ga{color:#ff9aa4;font-weight:950}.gd,.pts{font-weight:950}.form-mini{display:flex;gap:3px}.form-mini span{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:950}.team-panel{margin-top:10px;background:#0e141c;border:1px solid #273343;border-radius:13px;padding:11px}.team-panel-head{display:flex;align-items:center;gap:9px}.team-panel-head img{width:38px;height:38px;object-fit:contain}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.season-tabs{display:flex;gap:6px;overflow-x:auto;margin-top:9px}.back{margin-bottom:8px}.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 68px);transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;background:#f6f8fb;color:#11161d;padding:12px 15px;border-radius:14px;z-index:999999;font-size:13px;font-weight:950;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.app{padding:9px 8px 45px}.card{padding:12px}.grid2,.grid3,.lineup-wrap{grid-template-columns:1fr}.weather{grid-template-columns:repeat(2,1fr)}.team img{width:34px;height:34px}.result-row{grid-template-columns:63px minmax(0,1fr) auto}.statgrid{grid-template-columns:repeat(2,1fr)}.analysis-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>SOCCER MATCH <span style="font-size:10px;color:#7d8998">V4.1</span></h1><div class="sub">전체 리그 · 자동분석 · 라인업 · 결장 · 심판/카드 · 날씨 · 배당 · 순위표</div></div><button id="settingsBtn">API 설정</button></header>
<section class="card api-panel" id="apiPanel"><div class="row space"><div class="title">API-Football 설정</div><button id="closeSettings">닫기</button></div><div class="notice" style="margin-top:9px">키는 이 브라우저에만 저장됩니다. 날씨는 별도 키 없이 Open-Meteo를 사용합니다.</div><label>API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="API 키 붙여넣기"><div class="row" style="margin-top:9px"><button class="primary" id="saveKey">저장</button><button id="testKey">연결 테스트</button><button id="deleteKey">삭제</button></div></section>
<section class="card"><div class="top-tabs"><button id="matchesTab" class="active">경기</button><button id="standingsTab">순위표</button></div><div class="league-tools"><div class="segment" id="favoriteTabs"></div><button id="openLeaguePicker">리그 찾기</button></div><div class="selected-league" id="selectedLeagueText"></div><div class="league-picker hidden" id="leaguePicker"><div class="grid2"><div><label>국가</label><select id="countrySelect"><option value="">국가 불러오는 중…</option></select></div><div><label>리그 검색</label><input id="leagueSearch" placeholder="리그 이름 검색"></div></div><div class="row" style="margin-top:8px"><button class="primary" id="loadCountryLeagues">이 국가 리그 불러오기</button><button id="closeLeaguePicker">닫기</button></div><div class="league-results" id="leagueResults"><div class="empty">국가를 선택하세요.</div></div></div><div class="row space" style="margin-top:10px"><div></div><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">API 키 확인 필요</span></div></div></section>
<section class="card" id="matchesView"><div class="row space"><div class="title">경기 목록</div></div><div class="grid2" style="margin-top:8px"><div><label>날짜</label><input type="date" id="matchDate"></div><div style="display:flex;align-items:end"><button class="primary" id="loadFixtures" style="width:100%">경기 불러오기</button></div></div><div class="fixture-list" id="fixtureList"><div class="empty">경기를 불러오세요.</div></div></section>
<section class="card hidden" id="detailView"><button class="back" id="backBtn">← 경기 목록</button><div id="detailContent"></div></section>
<section class="card hidden" id="standingsView"><div class="row space"><div><div class="title">순위표</div><div class="sub" id="seasonLabel">시즌 선택</div></div><button class="primary" id="loadStandings">순위 불러오기</button></div><div class="season-tabs" id="seasonTabs"></div><div class="notice" style="margin-top:10px">GF=득점, GA=실점, GD=득실차. 팀을 누르면 전체/홈/원정 득실과 경기당 수치를 볼 수 있습니다.</div><div id="standingsContent"><div class="empty">시즌을 선택하세요.</div></div></section>
</div><div class="toast" id="toast"></div>
<script>
const BASE='https://v3.football.api-sports.io';
const DEFAULT_FAVS=[
{id:39,name:'Premier League',country:'England',short:'EPL'},{id:140,name:'La Liga',country:'Spain',short:'LaLiga'},{id:135,name:'Serie A',country:'Italy',short:'Serie A'},{id:78,name:'Bundesliga',country:'Germany',short:'Bundesliga'},{id:61,name:'Ligue 1',country:'France',short:'Ligue 1'},{id:2,name:'UEFA Champions League',country:'World',short:'UCL'},{id:3,name:'UEFA Europa League',country:'World',short:'UEL'},{id:292,name:'K League 1',country:'South-Korea',short:'K League 1'},{id:98,name:'J1 League',country:'Japan',short:'J1'}
];
let selectedLeague=JSON.parse(localStorage.getItem('soccer_selected_league')||'null')||DEFAULT_FAVS[0];
let currentSeason=new Date().getFullYear();let leagueSeasons=[];let currentH2H=[];let h2hHomeId=null;let h2hAwayId=null;let loadedCountryLeagues=[];
const cache=new Map();const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2200)}
function key(){return localStorage.getItem('soccer_api_key')||''}
function setStatus(text,type=''){ $('#statusText').textContent=text;$('#statusDot').className='dot '+type }
function todayKST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function apiErr(d){if(!d?.errors)return'';if(Array.isArray(d.errors))return d.errors.join(' ');return Object.values(d.errors).filter(Boolean).join(' ')}
async function api(path,ttl=300000){if(!key())throw new Error('API 키가 없습니다');const c=cache.get(path);if(c&&Date.now()-c.t<ttl)return c.v;const r=await fetch(BASE+path,{headers:{'x-apisports-key':key(),'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const e=apiErr(d);if(e)throw new Error(e);cache.set(path,{t:Date.now(),v:d});return d}
function fmtTime(iso){const d=new Date(iso);return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function score(f){const h=f.goals?.home,a=f.goals?.away;return h==null||a==null?'VS':`${h} - ${a}`}
function resultForTeam(f,id){const h=f.teams.home.id===id,gh=f.goals.home,ga=f.goals.away;if(gh==null||ga==null)return'';const x=h?gh:ga,y=h?ga:gh;return x>y?'W':x===y?'D':'L'}
function formPills(fs,id){return fs.map(f=>`<span class="form-pill ${resultForTeam(f,id)}">${resultForTeam(f,id)||'-'}</span>`).join('')}
function resultRow(f){return `<div class="result-row"><div>${esc(new Date(f.fixture.date).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}))}</div><div class="result-teams">${esc(f.teams.home.name)} vs ${esc(f.teams.away.name)}</div><div class="result-score">${esc(score(f))}</div></div>`}
function calcRecent(fs,id){let gf=0,ga=0,pts=0,played=0;for(const f of fs){if(f.goals.home==null)continue;const home=f.teams.home.id===id;const a=home?f.goals.home:f.goals.away,b=home?f.goals.away:f.goals.home;gf+=a;ga+=b;pts+=a>b?3:a===b?1:0;played++}return{played,gf,ga,ppg:played?pts/played:0,gfpg:played?gf/played:0,gapg:played?ga/played:0}}
function summarizeH2H(fs,a,b){let aw=0,d=0,bw=0,tg=0,over=0,btts=0,n=0;for(const f of fs){if(f.goals.home==null)continue;n++;const ah=f.teams.home.id===a,ag=ah?f.goals.home:f.goals.away,bg=ah?f.goals.away:f.goals.home;if(ag>bg)aw++;else if(ag<bg)bw++;else d++;tg+=ag+bg;if(ag+bg>2.5)over++;if(ag>0&&bg>0)btts++}return{n,aw,d,bw,avg:n?tg/n:0,over:n?over/n:0,btts:n?btts/n:0}}
function pickBet(bets,regs){return bets.find(x=>regs.some(r=>r.test((x.name||'').toLowerCase())))||null}
function oddsHtml(resp){const item=resp?.response?.[0];if(!item)return'<div class="notice">현재 프리매치 배당 데이터 없음</div>';return (item.bookmakers||[]).slice(0,3).map(book=>{const bets=book.bets||[];const win=pickBet(bets,[/match winner/,/1x2/]),ah=pickBet(bets,[/asian handicap/,/handicap/]),ou=pickBet(bets,[/goals over\/under/,/over\/under/,/totals/]);const market=(n,b)=>!b?'':`<div class="market"><div class="market-title">${n}</div><div class="odds-values">${(b.values||[]).slice(0,12).map(v=>`<div class="odd">${esc(v.value)}<b>${esc(v.odd)}</b></div>`).join('')}</div></div>`;return `<div class="odds-book"><div class="bookname">${esc(book.name)}</div>${market('승무패',win)}${market('핸디캡',ah)}${market('오버/언더',ou)}</div>`}).join('')}
function getFavs(){try{return JSON.parse(localStorage.getItem('soccer_favs'))||DEFAULT_FAVS}catch{return DEFAULT_FAVS}}
function saveFavs(x){localStorage.setItem('soccer_favs',JSON.stringify(x));renderFavorites()}
function renderFavorites(){const favs=getFavs();$('#favoriteTabs').innerHTML=favs.map(x=>`<button data-id="${x.id}" class="${x.id==selectedLeague.id?'active':''}">${esc(x.short||x.name)}</button>`).join('');$$('#favoriteTabs button').forEach((b,i)=>b.onclick=()=>selectLeague(favs[i]))}
async function selectLeague(x){selectedLeague=x;localStorage.setItem('soccer_selected_league',JSON.stringify(x));renderFavorites();$('#selectedLeagueText').textContent=`선택: ${x.name} · ${x.country||''}`;await loadLeagueMeta();if(!$('#standingsView').classList.contains('hidden'))showStandings()}
async function loadLeagueMeta(){try{const d=await api(`/leagues?id=${selectedLeague.id}`,3600000);const l=d.response?.[0];if(l){selectedLeague={...selectedLeague,name:l.league.name,country:l.country?.name||selectedLeague.country,logo:l.league.logo,seasons:l.seasons};localStorage.setItem('soccer_selected_league',JSON.stringify(selectedLeague));leagueSeasons=(l.seasons||[]).slice().sort((a,b)=>b.year-a.year);const cur=leagueSeasons.find(s=>s.current)||leagueSeasons[0];if(cur)currentSeason=cur.year;buildSeasonTabs();$('#selectedLeagueText').textContent=`선택: ${selectedLeague.name} · ${selectedLeague.country}`}}catch(e){leagueSeasons=[];buildSeasonTabs()}}
async function loadCountries(){try{const d=await api('/countries',86400000);const names=(d.response||[]).map(x=>x.name).filter(Boolean).sort();$('#countrySelect').innerHTML='<option value="">국가 선택</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}catch(e){$('#countrySelect').innerHTML='<option value="">국가 목록 실패</option>'}}
async function loadCountryLeagues(){const c=$('#countrySelect').value;if(!c){toast('국가를 선택하세요');return}$('#leagueResults').innerHTML='<div class="loader">리그 불러오는 중…</div>';try{const d=await api(`/leagues?country=${encodeURIComponent(c)}`,3600000);loadedCountryLeagues=d.response||[];renderLeagueResults()}catch(e){$('#leagueResults').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function renderLeagueResults(){const q=$('#leagueSearch').value.trim().toLowerCase();const favs=getFavs();const rows=loadedCountryLeagues.filter(x=>!q||x.league.name.toLowerCase().includes(q)).slice(0,200);$('#leagueResults').innerHTML=rows.length?rows.map((x,i)=>{const fav=favs.some(f=>f.id===x.league.id);return `<div class="league-item"><img src="${esc(x.league.logo||'')}" alt=""><div onclick="chooseLeagueResult(${i})"><div class="league-name">${esc(x.league.name)}</div><div class="league-country">${esc(x.country?.name||'')}</div></div><button class="star" onclick="toggleLeagueFav(event,${i})">${fav?'★':'☆'}</button></div>`}).join(''):'<div class="empty">검색 결과 없음</div>';window.__leagueRows=rows}
window.chooseLeagueResult=async i=>{const x=window.__leagueRows[i];await selectLeague({id:x.league.id,name:x.league.name,country:x.country?.name,short:x.league.name,seasons:x.seasons,logo:x.league.logo});$('#leaguePicker').classList.add('hidden');toast('리그 선택 완료')}
window.toggleLeagueFav=(e,i)=>{e.stopPropagation();const x=window.__leagueRows[i],favs=getFavs(),idx=favs.findIndex(f=>f.id===x.league.id);if(idx>=0)favs.splice(idx,1);else favs.push({id:x.league.id,name:x.league.name,country:x.country?.name,short:x.league.name});saveFavs(favs);renderLeagueResults()}
