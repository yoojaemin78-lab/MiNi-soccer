<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1017">
<title>SOCCER MATCH V5.2</title>
<style>
:root{--bg:#090d12;--panel:#131923;--panel2:#1b2330;--line:#293546;--text:#f5f7fb;--muted:#96a2b2;--green:#5ed28a;--red:#ff7e87;--yellow:#ffd166}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:radial-gradient(circle at 50% -15%,#233247 0,#101721 34%,#090d12 74%)}
.app{max-width:900px;margin:0 auto;padding:12px 10px 60px}header{padding:6px 3px 8px}h1{margin:0;font-size:24px}.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.card{background:rgba(19,25,35,.97);border:1px solid var(--line);border-radius:18px;padding:13px;margin:11px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tab{background:var(--panel2);color:#dfe5ed}.tab.active{background:#f5f7fb;color:#10151c;border-color:#f5f7fb}
label{display:block;color:#a8b2c0;font-size:10px;font-weight:800;margin:8px 2px 5px}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer}.primary{background:#f5f7fb!important;color:#10151c!important;border-color:#f5f7fb!important}
input,select{width:100%;background:#0d131b;color:#f5f7fb;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:13px}.status{display:flex;align-items:center;gap:7px;color:#b5bfcc;font-size:11px;margin-top:10px}.dot{width:8px;height:8px;border-radius:50%;background:#7a8492}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.loading{background:var(--yellow)}
.notice{background:#0f151d;border:1px solid #263140;border-radius:12px;padding:10px;color:#aab4c2;font-size:11px;line-height:1.55}.league-title{font-size:12px;font-weight:950;color:#dce3ec;margin:16px 2px 7px}.fixture{background:#0f151d;border:1px solid #283444;border-radius:15px;padding:11px;margin:8px 0}.fixture-top{display:flex;justify-content:space-between;gap:8px;color:#8f9baa;font-size:10px;margin-bottom:9px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{text-align:center;font-size:12px;font-weight:900}.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 5px}.vs{font-size:11px;color:#788494;font-weight:900;text-align:center}.score{font-size:20px;color:#fff}.empty{padding:20px 4px;text-align:center;color:#8d98a8;font-size:12px}.badbox{background:#261419;border:1px solid #5c2730;color:#ffb7bf;border-radius:12px;padding:10px;font-size:11px;line-height:1.6}
.table-wrap{overflow-x:auto;border:1px solid #283444;border-radius:14px;margin-top:10px}.standing{width:100%;border-collapse:collapse;min-width:610px;font-size:11px}.standing th{color:#8f9baa;background:#0d131b;padding:9px 6px;border-bottom:1px solid #283444;text-align:center}.standing td{padding:9px 6px;border-bottom:1px solid #202a37;text-align:center}.standing tr:last-child td{border-bottom:none}.standing .club{text-align:left;font-weight:850;white-space:nowrap}.clubbox{display:flex;align-items:center;gap:7px}.clubbox img{width:22px;height:22px;object-fit:contain}.rank{color:#9ba6b4;width:28px}.pts{font-weight:950;color:#fff}
.hidden{display:none!important}@media(max-width:560px){.app{padding:9px 8px 45px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><h1>SOCCER MATCH <span style="font-size:10px;color:#7d8998">V5.2 TEST</span></h1><div class="sub">ESPN 무료 현재경기 + 현재 순위표 테스트 · API 키 필요 없음</div></header>
<section class="card">
  <div class="tabs"><button id="matchTab" class="tab active">경기</button><button id="standTab" class="tab">순위표</button></div>
  <div class="notice" id="notice">현재 시즌 경기 목록 무료 연결은 확인됐습니다. 이번 버전은 <b>현재 순위표</b>까지 붙여서 확인합니다.</div>
  <div class="grid2" style="margin-top:8px">
    <div id="dateBox"><label>날짜</label><input type="date" id="matchDate"></div>
    <div><label>범위</label><select id="league">
      <option value="all">전체 축구</option><option value="eng.1">EPL</option><option value="esp.1">LaLiga</option><option value="ger.1">Bundesliga</option><option value="ita.1">Serie A</option><option value="fra.1">Ligue 1</option><option value="uefa.champions">UEFA Champions League</option><option value="uefa.europa">UEFA Europa League</option><option value="usa.1">MLS</option>
    </select></div>
  </div>
  <button class="primary" id="loadBtn" style="width:100%;margin-top:10px">경기 불러오기</button>
  <div class="status"><span class="dot" id="dot"></span><span id="status">대기 중</span></div>
</section>
<section class="card"><div id="sectionTitle" style="font-size:16px;font-weight:950">경기 목록</div><div id="results"><div class="empty">자동으로 불러오는 중…</div></div></section>
</div>
<script>
const $=s=>document.querySelector(s);let mode='match';
function todayKST(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>{if(x.type!=='literal')o[x.type]=x.value});return `${o.year}-${o.month}-${o.day}`}
$('#matchDate').value=todayKST();
function ymd(d){return d.replaceAll('-','')}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function setStatus(t,type=''){$('#status').textContent=t;$('#dot').className='dot '+type}
function kstTime(iso){try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}catch(e){return iso||'-'}}
async function fetchJson(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
function teamData(c){return{name:c?.team?.displayName||c?.team?.shortDisplayName||c?.team?.name||'-',logo:c?.team?.logo||c?.team?.logos?.[0]?.href||'',score:c?.score??''}}
function leagueLabel(ev){return ev?.league?.name||ev?.league?.displayName||ev?.season?.slug||'기타 경기'}
async function loadMatches(){const date=$('#matchDate').value,league=$('#league').value;if(!date)return;setStatus('ESPN 경기 연결 중…','loading');$('#results').innerHTML='<div class="empty">불러오는 중…</div>';const path=`/apis/site/v2/sports/soccer/${encodeURIComponent(league)}/scoreboard?dates=${ymd(date)}&limit=1000`,urls=['https://site.api.espn.com'+path,'https://site.web.api.espn.com'+path];let data,lastErr,used='';for(const u of urls){try{data=await fetchJson(u);used=u.includes('site.web')?'ESPN WEB API':'ESPN SITE API';break}catch(e){lastErr=e}}if(!data){setStatus('경기 연결 실패','bad');$('#results').innerHTML=`<div class="badbox">ESPN 경기 호출 실패: ${esc(lastErr?.message||'unknown')}</div>`;return}const events=Array.isArray(data.events)?data.events:[];setStatus(`${used} 정상 · ${events.length}경기`,'ok');if(!events.length){$('#results').innerHTML='<div class="empty">이 날짜/범위에 표시할 경기가 없습니다.</div>';return}const groups={};for(const ev of events){const key=leagueLabel(ev);(groups[key]||=[]).push(ev)}let html='';for(const[lname,list]of Object.entries(groups)){html+=`<div class="league-title">${esc(lname)} · ${list.length}경기</div>`;for(const ev of list){const comp=ev?.competitions?.[0]||{},cs=comp?.competitors||[],home=teamData(cs.find(x=>x.homeAway==='home')||cs[0]),away=teamData(cs.find(x=>x.homeAway==='away')||cs[1]),state=ev?.status?.type?.state||'pre',detail=ev?.status?.type?.shortDetail||ev?.status?.type?.detail||'',middle=state==='pre'?'VS':`${away.score||0} : ${home.score||0}`;html+=`<div class="fixture"><div class="fixture-top"><span>${esc(kstTime(ev.date))}</span><span>${esc(detail)}</span></div><div class="teams"><div class="team">${home.logo?`<img src="${esc(home.logo)}">`:''}${esc(home.name)}</div><div class="vs ${state!=='pre'?'score':''}">${esc(middle)}</div><div class="team">${away.logo?`<img src="${esc(away.logo)}">`:''}${esc(away.name)}</div></div></div>`}}$('#results').innerHTML=html}
function collectGroups(node,out=[]){if(!node||typeof node!=='object')return out;if(node.standings&&Array.isArray(node.standings.entries))out.push({name:node.name||node.displayName||node.abbreviation||'',entries:node.standings.entries});if(Array.isArray(node.children))node.children.forEach(x=>collectGroups(x,out));return out}
function statMap(entry){const m={};for(const s of(entry?.stats||[])){m[String(s.name||'').toLowerCase()]=s;m[String(s.abbreviation||'').toLowerCase()]=s;m[String(s.displayName||'').toLowerCase()]=s}return m}
function sval(m,names,fb='-'){for(const n of names){const s=m[n.toLowerCase()];if(s){if(s.displayValue!==undefined&&s.displayValue!=='')return s.displayValue;if(s.value!==undefined)return String(s.value)}}return fb}
function nval(m,names){for(const n of names){const s=m[n.toLowerCase()];if(s&&s.value!==undefined&&!Number.isNaN(Number(s.value)))return Number(s.value)}return null}
async function loadStandings(){let league=$('#league').value;if(league==='all'){setStatus('리그를 하나 선택해주세요','bad');$('#results').innerHTML='<div class="badbox">순위표는 “전체 축구”가 아니라 EPL, LaLiga처럼 한 리그를 선택한 뒤 불러와야 합니다.</div>';return}setStatus('ESPN 순위표 연결 중…','loading');$('#results').innerHTML='<div class="empty">순위표 불러오는 중…</div>';const path=`/apis/v2/sports/soccer/${encodeURIComponent(league)}/standings`,urls=['https://site.api.espn.com'+path,'https://site.web.api.espn.com'+path];let data,lastErr,used='';for(const u of urls){try{data=await fetchJson(u);used=u.includes('site.web')?'ESPN WEB API':'ESPN SITE API';break}catch(e){lastErr=e}}if(!data){setStatus('순위표 연결 실패','bad');$('#results').innerHTML=`<div class="badbox">ESPN 순위표 호출 실패: ${esc(lastErr?.message||'unknown')}</div>`;return}const groups=collectGroups(data);if(!groups.length){setStatus('순위표 응답은 왔지만 표를 찾지 못함','bad');$('#results').innerHTML='<div class="badbox">응답은 정상인데 순위표 구조를 찾지 못했습니다. 이 화면을 캡처해서 보내주세요.</div>';return}let html='';let count=0;for(const g of groups){if(g.name)html+=`<div class="league-title">${esc(g.name)}</div>`;html+='<div class="table-wrap"><table class="standing"><thead><tr><th>#</th><th style="text-align:left">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>GF</th><th>GA</th><th>GD</th><th>승점</th></tr></thead><tbody>';g.entries.forEach((e,i)=>{const m=statMap(e),t=e?.team||{},name=t.displayName||t.shortDisplayName||t.name||'-',logo=t.logos?.[0]?.href||t.logo||'',rank=sval(m,['rank','playoffseed'],String(i+1)),gp=sval(m,['gamesplayed','gp']),w=sval(m,['wins','w']),d=sval(m,['ties','draws','d']),l=sval(m,['losses','l']),gf=sval(m,['pointsfor','goalsfor','gf']),ga=sval(m,['pointsagainst','goalsagainst','ga']),gd=sval(m,['pointdifferential','differential','goaldifference','gd'],(()=>{const a=nval(m,['pointsfor','goalsfor','gf']),b=nval(m,['pointsagainst','goalsagainst','ga']);return a!==null&&b!==null?String(a-b):'-'})()),pts=sval(m,['points','pts']);html+=`<tr><td class="rank">${esc(rank)}</td><td class="club"><div class="clubbox">${logo?`<img src="${esc(logo)}">`:''}<span>${esc(name)}</span></div></td><td>${esc(gp)}</td><td>${esc(w)}</td><td>${esc(d)}</td><td>${esc(l)}</td><td>${esc(gf)}</td><td>${esc(ga)}</td><td>${esc(gd)}</td><td class="pts">${esc(pts)}</td></tr>`;count++});html+='</tbody></table></div>'}setStatus(`${used} 순위표 정상 · ${count}팀`,'ok');$('#results').innerHTML=html}
function setMode(next){mode=next;$('#matchTab').classList.toggle('active',mode==='match');$('#standTab').classList.toggle('active',mode==='stand');$('#dateBox').classList.toggle('hidden',mode==='stand');$('#sectionTitle').textContent=mode==='match'?'경기 목록':'순위표';$('#loadBtn').textContent=mode==='match'?'경기 불러오기':'순위표 불러오기';$('#notice').innerHTML=mode==='match'?'현재 시즌 경기 목록 무료 연결은 확인됐습니다. 이번 버전은 <b>현재 순위표</b>까지 붙여서 확인합니다.':'ESPN의 현재 시즌 <b>순위표</b>를 직접 불러옵니다. GF · GA · GD · 승점까지 확인합니다.';$('#results').innerHTML='<div class="empty">'+(mode==='match'?'경기를':'리그를 선택하고 순위표를')+' 불러와주세요.</div>';setStatus('대기 중','')}
$('#matchTab').onclick=()=>setMode('match');$('#standTab').onclick=()=>setMode('stand');$('#loadBtn').onclick=()=>mode==='match'?loadMatches():loadStandings();loadMatches();
</script>
</body>
</html>
